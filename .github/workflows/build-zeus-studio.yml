name: Build Zeus Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Zeus Studio APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13.1'

      - name: Verify Java
        run: |
          java -version

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Build Zeus Studio
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Locate APK
        run: |
          echo "=== APK files ==="
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeusStudio-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error