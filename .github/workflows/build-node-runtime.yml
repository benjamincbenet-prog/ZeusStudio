name: Build Zeus Node Runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime:
    name: Build Android ARM64 Runtime
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Install required tools
      # --------------------------------------------------

      - name: Install tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            dpkg-dev \
            file \
            tar \
            gzip \
            xz-utils


      # --------------------------------------------------
      # Create directories
      # --------------------------------------------------

      - name: Create runtime directories
        run: |
          mkdir -p runtime/build
          mkdir -p runtime/package


      # --------------------------------------------------
      # Download Termux ARM64 Node
      # --------------------------------------------------

      - name: Download Node ARM64 package
        run: |
          curl -L \
            "https://packages.termux.dev/apt/termux-main/pool/main/n/nodejs/nodejs_26.4.0-1_aarch64.deb" \
            -o runtime/build/nodejs.deb


      # --------------------------------------------------
      # Verify downloaded package
      # --------------------------------------------------

      - name: Verify Node package
        run: |
          echo "eaf3ed8a6e4b72ebaa8c2cb3bad778c577cdf9ea87ca91761213d8a3940fc090  runtime/build/nodejs.deb" \
            | sha256sum -c -


      # --------------------------------------------------
      # Extract Node package
      # --------------------------------------------------

      - name: Extract Node package
        run: |
          mkdir -p runtime/build/rootfs

          dpkg-deb -x \
            runtime/build/nodejs.deb \
            runtime/build/rootfs


      # --------------------------------------------------
      # Inspect runtime
      # --------------------------------------------------

      - name: Inspect runtime
        run: |
          echo "=== Node executable ==="

          find runtime/build/rootfs \
            -type f \
            \( -name node -o -name nodejs \) \
            -exec file {} \;

          echo
          echo "=== Runtime files ==="

          find runtime/build/rootfs \
            -type f \
            | sort

          echo
          echo "=== Shared libraries ==="

          find runtime/build/rootfs \
            -type f \
            \( -name "*.so" -o -name "*.so.*" \) \
            | sort


      # --------------------------------------------------
      # Prepare Node executable for Zeus Studio
      # --------------------------------------------------

      - name: Prepare Node for Zeus Studio
        run: |
          mkdir -p app/src/main/assets

          cp \
            runtime/build/rootfs/data/data/com.termux/files/usr/bin/node \
            app/src/main/assets/node

          chmod 644 app/src/main/assets/node

          echo "=== Zeus Studio Node ==="

          file app/src/main/assets/node

          ls -lh app/src/main/assets/node


      # --------------------------------------------------
      # Create runtime archive
      # --------------------------------------------------

      - name: Create runtime archive
        run: |
          tar -czf \
            runtime/package/zeus-node-runtime-android-arm64.tar.gz \
            -C runtime/build/rootfs .


      # --------------------------------------------------
      # Generate SHA256
      # --------------------------------------------------

      - name: Generate SHA256
        run: |
          cd runtime/package

          sha256sum \
            zeus-node-runtime-android-arm64.tar.gz \
            > zeus-node-runtime-android-arm64.sha256


      # --------------------------------------------------
      # Upload Node executable as GitHub artifact
      # --------------------------------------------------

      - name: Upload Node asset
        uses: actions/upload-artifact@v4
        with:
          name: zeus-node-android-arm64
          path: app/src/main/assets/node


      # --------------------------------------------------
      # Verify runtime archive
      # --------------------------------------------------

      - name: Verify runtime archive
        run: |
          tar -tzf \
            runtime/package/zeus-node-runtime-android-arm64.tar.gz \
            | head -100


      # --------------------------------------------------
      # Delete previous runtime release
      # --------------------------------------------------

      - name: Delete existing release
        run: |
          gh release delete v0.1.0-runtime \
            --yes \
            --cleanup-tag \
            || true
        env:
          GH_TOKEN: ${{ github.token }}


      # --------------------------------------------------
      # Create GitHub runtime release
      # --------------------------------------------------

      - name: Create runtime release
        run: |
          gh release create \
            v0.1.0-runtime \
            runtime/package/zeus-node-runtime-android-arm64.tar.gz \
            runtime/package/zeus-node-runtime-android-arm64.sha256 \
            --title "Zeus Node Runtime v0.1.0" \
            --notes "Android ARM64 Node.js runtime for Zeus Studio."
        env:
          GH_TOKEN: ${{ github.token }}